<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Sales & Marketing AI</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e2738;
            --accent-color: #0088cc;
            --accent-hover: #00a0f0;
            --text-color: #ffffff;
            --text-muted: #8e9bae;
            --border-color: #2a364f;
            --pro-color: #f39c12;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            padding: 8px 0 12px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 18px;
            margin: 0;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .header p {
            font-size: 12px;
            color: var(--text-muted);
            margin: 4px 0 0;
        }

        .tool-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .tool-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .tool-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .chat-container {
            flex: 1;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .message {
            max-width: 85%;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .message.bot {
            background-color: #26334d;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.user {
            background-color: var(--accent-color);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .input-container {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button.send-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .pro-btn {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="user-greeting">Nexus Sales & Marketing AI</h1>
        <p>Tu asistente de ventas B2B directo en Telegram</p>
    </div>

    <div class="tool-selector">
        <button class="tool-btn active" onclick="selectTool('ganchos', this)">🔥 Ganchos</button>
        <button class="tool-btn" onclick="selectTool('cierre', this)">💬 Cierre</button>
        <button class="tool-btn" onclick="selectTool('contenido', this)">📅 Contenido</button>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message bot">¡Hola! Soy tu Asistente de Ventas y Marketing B2B. Selecciona una herramienta arriba o dime qué producto ofertas para empezar.</div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Escribe tu producto aquí..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">Enviar</button>
    </div>

    <button class="pro-btn" onclick="triggerStarsPayment()">★ Activar Modo Pro (50 Stars)</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentTool = 'ganchos';

        // Personalizar saludo si está en Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-greeting').innerText = `¡Hola, ${user.first_name}! 👋`;
        }

        function selectTool(tool, element) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const product = inputField.value.trim();

            if (!product) return;

            addMessage(product, 'user');
            inputField.value = '';

            const loadingId = addMessage("Nexus IA conectando con el servidor...", 'bot');

            let promptContext = "";
            if (currentTool === 'ganchos') {
                promptContext = `Genera 3 ganchos publicitarios de alto impacto y una propuesta corta de valor en español para vender el siguiente producto: ${product}`;
            } else if (currentTool === 'cierre') {
                promptContext = `Dame 2 respuestas efectivas para rebatir objeciones de precio o dudas comunes en español para vender: ${product}`;
            } else if (currentTool === 'contenido') {
                promptContext = `Crea una pequeña estrategia de contenido de 3 días (1 reel, 1 carrusel, 1 historia) en español para promocionar: ${product}`;
            }

            // Usamos corsproxy.io para evitar bloqueos regionales y garantizar la respuesta
            const proxyUrl = `https://corsproxy.io/?` + encodeURIComponent(`https://text.pollinations.ai/${encodeURIComponent(promptContext)}`);

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Error en la respuesta del servidor");
                
                const textResponse = await response.text();
                
                if (textResponse && textResponse.trim().length > 0) {
                    updateMessage(loadingId, textResponse);
                } else {
                    throw new Error("Respuesta vacía");
                }
            } catch (error) {
                console.error(error);
                // Respaldo de contingencia en caso de intermitencia de red
                let fallbackMsg = "";
                if (currentTool === 'ganchos') {
                    fallbackMsg = `🔥 **Ganchos para ${product}:**\n\n1. "¿Cansado de buscar la mejor opción en ${product}? Mira esto..."\n2. "Lo que nadie te dice sobre adquirir un buen ${product}."\n3. "Transforma tu experiencia con ${product} hoy mismo."`;
                } else if (currentTool === 'cierre') {
                    fallbackMsg = `💬 **Cierre de ventas para ${product}:**\n\n- *Objeción de precio:* "Entiendo tu punto. Sin embargo, con este ${product} ahorras tiempo y obtienes garantía directa."\n- *Llamado a la acción:* "¿Te gustaría agendar una prueba o envío hoy mismo?"`;
                } else {
                    fallbackMsg = `📅 **Estrategia para ${product}:**\n\n- Día 1 (Reel): Demostración en vivo de uso de ${product}.\n- Día 2 (Carrusel): 3 razones para elegir nuestro ${product}.\n- Día 3 (Historia): Oferta o descuento por tiempo limitado.`;
                }
                updateMessage(loadingId, fallbackMsg);
            }
        }

        function addMessage(text, sender) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            const id = 'msg-' + Date.now();
            messageDiv.id = id;
            messageDiv.className = `message ${sender}`;
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function updateMessage(id, text) {
            const messageDiv = document.getElementById(id);
            if (messageDiv) {
                messageDiv.innerText = text;
                const chatContainer = document.getElementById('chatContainer');
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function triggerStarsPayment() {
            if (tg.showAlert) {
                tg.showAlert("🌟 Modo Pro en desarrollo. Próximamente podrás desbloquear consultas ilimitadas con Telegram Stars.");
            } else {
                alert("🌟 Modo Pro en desarrollo. Próximamente podrás desbloquear consultas ilimitadas con Telegram Stars.");
            }
        }
    </script>
</body>
</html>
