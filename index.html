<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Sales & Marketing AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            height: 92vh;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .user-welcome {
            font-size: 13px;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 4px;
        }

        h1 {
            font-size: 19px;
            background: linear-gradient(to right, #ffffff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        /* Modos/Herramientas rápidas */
        .tools-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tool-btn {
            flex: 1;
            white-space: nowrap;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #94a3b8;
            padding: 8px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .tool-btn.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            color: #38bdf8;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 6px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 88%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 13.5px;
            line-height: 1.5;
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.7);
            color: white;
            font-size: 13.5px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .btn-send {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 14px;
            padding: 0 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-send:hover {
            background: #7dd3fc;
        }

        .btn-premium {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
        }

        #chat-box::-webkit-scrollbar {
            width: 5px;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background-color: rgba(56, 189, 248, 0.3);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="user-welcome" id="username">¡Hola, Emprendedor! 👋</div>
            <h1>Nexus Sales & Marketing AI</h1>
        </div>

        <!-- Barra de herramientas especializadas -->
        <div class="tools-bar">
            <button class="tool-btn active" onclick="setMode('copy', this)">🔥 Ganchos & Copies</button>
            <button class="tool-btn" onclick="setMode('sales', this)">💬 Cierre de Ventas</button>
            <button class="tool-btn" onclick="setMode('plan', this)">📅 Plan Contenido</button>
        </div>

        <div id="chat-box">
            <div class="message ai-message">
                ¡Hola! Soy tu asistente especializado en Ventas y Marketing. Selecciona una herramienta arriba o dime qué producto/servicio vendes para empezar.
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Escribe tu producto o duda aquí..." onkeypress="handleKeyPress(event)">
            <button class="btn-send" onclick="sendMessage()">Enviar</button>
