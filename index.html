<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI - Asistente</title>
    <!-- Librería oficial de Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .user-welcome {
            font-size: 13px;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 20px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .btn-send {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 14px;
            padding: 0 20px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-send:hover {
            background: #7dd3fc;
        }

        .btn-premium {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        #chat-box::-webkit-scrollbar {
            width: 6px;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background-color: rgba(56, 189, 248, 0.3);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="user-welcome" id="username">¡Hola, Usuario!</div>
            <h1>Nexus AI Assistant</h1>
        </div>

        <div id="chat-box">
            <div class="message ai-message">
                ¡Hola! Soy tu asistente inteligente. ¿En qué puedo ayudarte hoy?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Escribe tu pregunta aquí..." onkeypress="handleKeyPress(event)">
            <button class="btn-send" onclick="sendMessage()">Enviar</button>
        </div>

        <button class="btn-premium" onclick="triggerStarsPayment()">
            ★ Activar Modo Pro (Ilimitado)
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('username').innerText = `¡Hola, ${user.first_name}! 👋`;
        }

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user-message');
            userInput.value = '';

            showLoading();

            try {
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://api.quotable.io/random')}`);
                const data = await response.json();
                const quote = JSON.parse(data.contents);

                removeLoading();
                appendMessage(`Como soy una demo, aquí tienes una frase inspiradora: "${quote.content}" - ${quote.author}`, 'ai-message');
            } catch (error) {
                removeLoading();
                appendMessage("Lo siento, tuve un problema de conexión. Intenta de nuevo.", 'ai-message');
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showLoading() {
            const loader = document.createElement('div');
            loader.className = 'message ai-message';
            loader.id = 'loading-msg';
            loader.innerText = 'Pensando...';
            chatBox.appendChild(loader);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeLoading() {
            const loader = document.getElementById('loading-msg');
            if (loader) chatBox.removeChild(loader);
        }

        function triggerStarsPayment() {
            if (tg.showPopup) {
                tg.showPopup({
                    title: '★ Nexus Pro',
                    message: 'Obtén respuestas ilimitadas y acceso a modelos avanzados por 50 Stars.',
                    buttons: [
                        { type: 'default', text: 'Pagar 50 Stars', id: 'pay' },
                        { type: 'cancel', text: 'Cancelar' }
                    ]
                }, function(buttonId) {
                    if (buttonId === 'pay') {
                        tg.showAlert('¡Gracias! Has desbloqueado Nexus Pro.');
                    }
                });
            }
        }
    </script>
</body>
</html>
