<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Premium App</title>
    <!-- Librería oficial de Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .user-welcome {
            font-size: 14px;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .card:hover, .card:active {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
        }

        .card-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #f1f5f9;
        }

        .btn-stars {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-stars:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="user-welcome" id="username">¡Hola, Usuario!</div>
        <h1>Ecosistema Nexus</h1>

        <div class="grid">
            <div class="card" onclick="openSection('Servicios')">
                <div class="card-icon">⚡</div>
                <div class="card-title">Servicios</div>
            </div>
            <div class="card" onclick="openSection('Catálogo')">
                <div class="card-icon">📦</div>
                <div class="card-title">Catálogo</div>
            </div>
            <div class="card" onclick="openSection('Herramientas')">
                <div class="card-icon">🛠️</div>
                <div class="card-title">Herramientas</div>
            </div>
            <div class="card" onclick="openSection('Soporte')">
                <div class="card-icon">💬</div>
                <div class="card-title">Soporte VIP</div>
            </div>
        </div>

        <button class="btn-stars" onclick="triggerStarsPayment()">
            ★ Obtener Pase Premium
        </button>
    </div>

    <script>
        // Inicializar Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Expandir la app a pantalla completa

        // Detectar nombre del usuario en Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('username').innerText = `¡Hola, ${user.first_name}! 👋`;
        }

        // Función para abrir secciones con Popup nativo de Telegram
        function openSection(name) {
            if (tg.showPopup) {
                tg.showPopup({
                    title: name,
                    message: `Has seleccionado la sección: ${name}. Próximamente con contenido exclusivo.`,
                    buttons: [{ type: 'ok', text: 'Entendido' }]
                });
            } else {
                alert(`Sección: ${name}`);
            }
        }

        // Simular pago con Telegram Stars
        function triggerStarsPayment() {
            if (tg.showPopup) {
                tg.showPopup({
                    title: '★ Desbloquear Nexus VIP',
                    message: '¿Deseas activar el acceso Premium con Telegram Stars?',
                    buttons: [
                        { type: 'default', text: 'Pagar 50 Stars', id: 'pay' },
                        { type: 'cancel', text: 'Cancelar' }
                    ]
                }, function(buttonId) {
                    if (buttonId === 'pay') {
                        tg.showAlert('¡Gracias! La integración de pago real con Stars se procesará aquí.');
                    }
                });
            }
        }
    </script>
</body>
</html>
