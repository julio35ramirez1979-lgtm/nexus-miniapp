<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Sales & Marketing AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            height: 92vh;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .user-welcome {
            font-size: 13px;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 4px;
        }

        h1 {
            font-size: 19px;
            background: linear-gradient(to right, #ffffff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .tools-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tool-btn {
            flex: 1;
            white-space: nowrap;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #94a3b8;
            padding: 8px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .tool-btn.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            color: #38bdf8;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 6px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 88%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 13.5px;
            line-height: 1.5;
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.7);
            color: white;
            font-size: 13.5px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .btn-send {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 14px;
            padding: 0 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-send:hover {
            background: #7dd3fc;
        }

        .btn-premium {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
        }

        #chat-box::-webkit-scrollbar {
            width: 5px;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background-color: rgba(56, 189, 248, 0.3);
            border-radius: 10px;
        }
    </style>
</head>

        </div>

        <div class="tools-bar">
            <button class="tool-btn active" onclick="setMode('copy', this)">🔥 Ganchos & Copies</button>
            <button class="tool-btn" onclick="setMode('sales', this)">💬 Cierre de Ventas</button>
            <button class="tool-btn" onclick="setMode('plan', this)">📅 Plan Contenido</button>
        </div>

        <div id="chat-box">

        </div>

            <input type="text" id="user-input" placeholder="Escribe tu producto o duda aquí..." onkeypress="handleKeyPress(event)">

        </button>

            document.getElementById('username').innerText = `¡Hola, ${user.first_name}! 👋`;
        }

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        let currentMode = 'copy';

        function setMode(mode, btnElement) {
            currentMode = mode;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            let promptHint = "";
            if (mode === 'copy') promptHint = "Escribe tu producto y te daré 3 ganchos + copy...";
            else if (mode === 'sales') promptHint = "Escribe la objeción del cliente (ej: está caro)...";
            else if (mode === 'plan') promptHint = "Escribe tu nicho para darte un plan estratégico...";

            userInput.placeholder = promptHint;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user-message');
            userInput.value = '';

            showLoading();

            try {
                let systemInstruction = "";
                if (currentMode === 'copy') {
                    systemInstruction = "Eres un Copywriter B2B experto. El usuario te dirá su producto/servicio. Entrega: 1) 3 Ganchos (Hooks) altamente magnéticos para redes sociales. 2) Un Copy publicitario enfocado en beneficios y conversión con CTA claro.";
                } else if (currentMode === 'sales') {
                    systemInstruction = "Eres un especialista en Cierre de Ventas por WhatsApp y Telegram. El usuario te dará una objeción o duda de un cliente. Ofrécele 2 guiones de respuesta persuasiva enfocados en reencuadrar el valor del producto y cerrar la venta.";
                } else if (currentMode === 'plan') {
                    systemInstruction = "Eres un Estratega de Marketing de Contenidos. El usuario te dirá su nicho o negocio. Entrégale un Plan Estratégico de Contenidos de 7 días (Lunes a Domingo) con pilares de venta, educación y entretenimiento.";
                }

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: systemInstruction },
                                { text: text }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                removeLoading();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let aiResponse = data.candidates[0].content.parts[0].text;
                    // Formatear negritas básicas y saltos de línea
                    aiResponse = aiResponse.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
                    appendMessage(aiResponse, 'ai-message');
                } else {
                    appendMessage("Ocurrió un detalle al procesar tu solicitud. Por favor intenta de nuevo.", 'ai-message');
                }
            } catch (error) {
                removeLoading();
                appendMessage("Error de conexión con el servidor de IA. Revisa tu señal e intenta nuevamente.", 'ai-message');
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showLoading() {
            const loader = document.createElement('div');
            loader.className = 'message ai-message';
            loader.id = 'loading-msg';
            loader.innerText = 'Analizando tu estrategia con Gemini...';
            chatBox.appendChild(loader);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeLoading() {
            const loader = document.getElementById('loading-msg');
            if (loader) chatBox.removeChild(loader);
        }
