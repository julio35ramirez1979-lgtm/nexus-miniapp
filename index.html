<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Conversor PDF a Imagen</title>
    <!-- Librería oficial de Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- PDF.js para procesar los PDFs directamente en el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .user-welcome {
            font-size: 14px;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .upload-box {
            border: 2px dashed rgba(56, 189, 248, 0.4);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-box:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.05);
        }

        .upload-icon {
            font-size: 32px;
            margin-bottom: 6px;
        }

        .upload-text {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 4px;
        }

        .upload-subtext {
            font-size: 12px;
            color: #64748b;
        }

        input[type="file"] {
            display: none;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.3);
            margin-bottom: 10px;
        }

        .btn-stars {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.3);
            margin-bottom: 15px;
        }

        #file-info {
            font-size: 13px;
            color: #38bdf8;
            margin-bottom: 15px;
            word-break: break-all;
        }

        #results-container {
            max-height: 320px;
            overflow-y: auto;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .image-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .image-card span {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .preview-img {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0f172a;
        }

        .hint-text {
            font-size: 11px;
            color: #94a3b8;
            font-style: italic;
        }

        .btn-open {
            background: #10b981;
            color: white;
            padding: 11px 16px;
            border-radius: 10px;
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .loader {
            display: none;
            font-size: 14px;
            color: #38bdf8;
            margin: 10px 0;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="user-welcome" id="username">¡Hola, Usuario!</div>
        <h1>Conversor PDF a Imagen</h1>

        <!-- Zona para cargar archivo -->
        <div class="upload-box" onclick="document.getElementById('pdfFile').click()">
            <div class="upload-icon">📄</div>
            <div class="upload-text" id="upload-label">Toca para seleccionar tu PDF</div>
            <div class="upload-subtext">Procesamiento instantáneo y privado</div>
        </div>
        <input type="file" id="pdfFile" accept=".pdf" onchange="handleFileSelect(event)">

        <div id="file-info"></div>

        <button class="btn-action" id="convert-btn" onclick="convertPDF()" style="display:none;">
            ⚡ Convertir a Imágenes Ahora
        </button>

        <div class="loader" id="loader">🔄 Procesando páginas, por favor espera...</div>

        <button class="btn-stars" onclick="triggerStarsPayment()">
            ★ Desbloquear Ilimitados (Stars)
        </button>

        <div id="results-container"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('username').innerText = `¡Hola, ${user.first_name}! 👋`;
        }

        let selectedFile = null;

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('upload-label').innerText = "PDF listo:";
                document.getElementById('file-info').innerText = `📎 ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`;
                document.getElementById('convert-btn').style.display = 'block';
                document.getElementById('results-container').innerHTML = '';
            }
        }

        async function convertPDF() {
            if (!selectedFile) return;

            const loader = document.getElementById('loader');
            const resultsContainer = document.getElementById('results-container');
            loader.style.display = 'block';
            resultsContainer.innerHTML = '';

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdfDoc = await loadingTask.promise;
                const numPages = pdfDoc.numPages;

                for (let i = 1; i <= numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 1.2 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    const imageUrl = canvas.toDataURL('image/jpeg');

                const card = document.createElement('div');
                card.className = 'image-card';
                card.innerHTML = `
                    <span>Página ${i} de ${numPages}</span>
                    <img src="${imageUrl}" class="preview-img" alt="Página ${i}">
                    <span class="hint-text">💡 Mantén presionada la imagen para guardarla</span>
                    <a href="${imageUrl}" target="_blank" class="btn-open">
                        🔍 Abrir Imagen Completa
                    </a>
                `;
                    resultsContainer.appendChild(card);
                }

                loader.style.display = 'none';
                if (tg.showAlert) {
                    tg.showAlert(`¡Conversión completada! Se procesaron ${numPages} páginas con éxito.`);
                }
            } catch (error) {
                loader.style.display = 'none';
                alert('Ocurrió un error al procesar el PDF. Asegúrate de que no esté dañado.');
                console.error(error);
            }
        }

        function triggerStarsPayment() {
            if (tg.showPopup) {
                tg.showPopup({
                    title: '★ Pase Pro Ilimitado',
                    message: 'Activa conversiones ilimitadas y procesamiento prioritario por 30 Telegram Stars.',
                    buttons: [
                        { type: 'default', text: 'Pagar 30 Stars', id: 'pay' },
                        { type: 'cancel', text: 'Cancelar' }
                    ]
                }, function(buttonId) {
                    if (buttonId === 'pay') {
                        tg.showAlert('¡Gracias! Pase Pro activado en tu cuenta.');
                    }
                });
            }
        }
    </script>
</body>
</html>
