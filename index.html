
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Sales & Marketing AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 14px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            height: 94vh;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .user-welcome {
            font-size: 12px;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 2px;
        }

        h1 {
            font-size: 17px;
            background: linear-gradient(to right, #ffffff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .tools-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            width: 100%;
        }

        .tool-btn {
            flex: 1;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: #94a3b8;
            padding: 10px 4px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease-in-out;
            touch-action: manipulation;
        }

        .tool-btn.active {
            background: #38bdf8 !important;
            color: #0f172a !important;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 12px;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            user-select: text;
        }

        .message {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.4;
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.8);
            color: white;
            font-size: 13px;
            outline: none;
            user-select: text;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .btn-send {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 12px;
            padding: 0 16px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
        }

        .btn-premium {
            margin-top: 8px;
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="user-welcome" id="username">¡Hola, Emprendedor! 👋</div>
            <h1>Nexus Sales & Marketing AI</h1>
        </div>

        <div class="tools-bar">
            <div id="btn-copy" class="tool-btn active">🔥 Ganchos</div>
            <div id="btn-sales" class="tool-btn">💬 Cierre</div>
            <div id="btn-plan" class="tool-btn">📅 Contenido</div>
        </div>

        <div id="chat-box">
            <div class="message ai-message">
                ¡Hola! Soy tu Asistente de Ventas y Marketing B2B. Selecciona una herramienta arriba o dime qué producto ofertas para empezar.
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Escribe tu producto aquí..." onkeypress="handleKeyPress(event)">
            <button class="btn-send" id="btn-send-msg">Enviar</button>
        </div>

        <button class="btn-premium" id="btn-stars-pay">
            ★ Activar Modo Pro (50 Stars)
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('username').innerText = `¡Hola, ${user.first_name}! 👋`;
        }

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        let currentMode = 'copy';

        function setMode(mode) {
            currentMode = mode;
            
            const btnCopy = document.getElementById('btn-copy');
            const btnSales = document.getElementById('btn-sales');
            const btnPlan = document.getElementById('btn-plan');

            btnCopy.classList.remove('active');
            btnSales.classList.remove('active');
            btnPlan.classList.remove('active');

            let promptHint = "";
            if (mode === 'copy') {
                btnCopy.classList.add('active');
                promptHint = "Escribe tu producto para darte 3 ganchos + copy...";
            } else if (mode === 'sales') {
                btnSales.classList.add('active');
                promptHint = "Escribe la objeción del cliente (ej: está caro)...";
            } else if (mode === 'plan') {
                btnPlan.classList.add('active');
                promptHint = "Escribe tu nicho para darte un plan de 7 días...";
            }

            userInput.placeholder = promptHint;
        }

        function bindTouch(elementId, callback) {
            const el = document.getElementById(elementId);
            if (!el) return;
            
            const handler = function(e) {
                e.preventDefault();
                callback();
            };

            el.addEventListener('touchstart', handler, { passive: false });
            el.addEventListener('click', callback);
        }

        bindTouch('btn-copy', () => setMode('copy'));
        bindTouch('btn-sales', () => setMode('sales'));
        bindTouch('btn-plan', () => setMode('plan'));
        bindTouch('btn-send-msg', () => sendMessage());
        bindTouch('btn-stars-pay', () => triggerStarsPayment());

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user-message');
            userInput.value = '';

            showLoading();

            setTimeout(() => {
                removeLoading();
                let aiResponse = "";

                if (currentMode === 'copy') {
                    aiResponse = `<b>Estrategia de Ganchos y Copy para:</b> "${text}"<br><br>` +
                                 `<b>🔥 Ganchos Magnéticos:</b><br>` +
                                 `1. "¿Cansado de buscar ${text} sin encontrar calidad real? Esto te interesa..."<br>` +
                                 `2. "El secreto que los negocios líderes están usando con ${text} en este momento."<br>` +
                                 `3. "No compres ${text} sin antes ver esta oferta exclusiva."<br><br>` +
                                 `<b>📢 Copy Publicitario:</b><br>` +
                                 `Optimiza tus resultados hoy mismo. Consigue lo mejor en ${text} con garantía de satisfacción y atención inmediata. ¡Escríbenos al DM para apartar el tuyo! 🚀`;
                } else if (currentMode === 'sales') {
                    aiResponse = `<b>Guías de Cierre para la objeción:</b> "${text}"<br><br>` +
                                 `<b>💡 Opción 1 (Reencuadre de Valor):</b><br>` +
                                 `"Entiendo perfectamente tu punto. Sin embargo, más que un gasto, piensa en esto como una inversión que te ahorrará dolores de cabeza a futuro. ¿Te parece bien si avanzamos?"<br><br>` +
                                 `<b>💡 Opción 2 (Escasez / Urgencia):</b><br>` +
                                 `"Comprendo tu presupuesto. Justamente por eso tenemos pocas unidades disponibles a este precio. ¿Deseas que te reservemos una antes de que se agote?"`;
                } else {
                    aiResponse = `<b>Plan de Contenidos de 7 Días para:</b> "${text}"<br><br>` +
                                 `• <b>Lunes:</b> Presentación y beneficios principales.<br>` +
                                 `• <b>Martes:</b> Testimonio o caso de éxito.<br>` +
                                 `• <b>Miércoles:</b> Resolución de mitos o dudas frecuentes.<br>` +
                                 `• <b>Jueves:</b> Detrás de escena / Proceso de trabajo.<br>` +
                                 `• <b>Viernes:</b> Promoción especial de fin de semana.<br>` +
                                 `• <b>Sábado:</b> Tips educativos relacionados con el nicho.<br>` +
                                 `• <b>Domingo:</b> Preguntas y respuestas con la comunidad.`;
                }

                appendMessage(aiResponse, 'ai-message');
            }, 800);
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showLoading() {
            const loader = document.createElement('div');
            loader.className = 'message ai-message';
            loader.id = 'loading-msg';
            loader.innerText = 'Analizando estrategia de marketing...';
            chatBox.appendChild(loader);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeLoading() {
            const loader = document.getElementById('loading-msg');
            if (loader) chatBox.removeChild(loader);
        }

        function triggerStarsPayment() {
            if (tg.showPopup) {
                tg.showPopup({
                    title: '★ Nexus Pro',
                    message: 'Desbloquea asesoría de marketing ilimitada y modelos avanzados por 50 Stars.',
                    buttons: [
                        { type: 'default', text: 'Pagar 50 Stars', id: 'pay' },
                        { type: 'cancel', text: 'Cancelar' }
                    ]
                }, function(buttonId) {
                    if (buttonId === 'pay') {
                        tg.showAlert('¡Gracias por activar Nexus Pro!');
                    }
                });
            }
        }
    </script>
</body>
</html>
